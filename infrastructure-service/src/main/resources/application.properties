spring.application.name=infrastructure-service
server.port=8083

# Config Server (optional - fallback to local properties if unavailable)
# .env (gitignored, next to this pom.xml) - local secrets loaded as properties, e.g. OS_KEYSTONE_URL=...
spring.config.import=optional:configserver:http://localhost:8888,optional:file:.env[.properties]

# Database Configuration (fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/infrastructure_db
spring.datasource.username=postgres
spring.datasource.password=antigravity
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT (same secret as auth-service/Gateway - fallback if Config Server is unreachable)
jwt.secret=pPFM3kM5_3idcnhixl8AcKNtfhbmiUurkwXzR4GNJIvIIaXctfq7fyJjS5_nLOvcU6_pXrtHeQiyIJO1LamLMA==

# OpenStack Configuration
openstack.auth.endpoint=http://192.168.10.50:5000/v3
openstack.auth.username=safozi-app

openstack.auth.password=${OPENSTACK_PASSWORD:6d1oJ3IquyE2}
openstack.auth.project=safozi
openstack.auth.domain=default
openstack.auth.region=RegionOne

openstack.nova.endpoint=http://192.168.10.50:8774/v2.1
openstack.glance.endpoint=http://192.168.10.50:9292/v2
openstack.neutron.endpoint=http://192.168.10.50:9696

# OpenStack Telemetry (Gnocchi/Ceilometer) - dedicated, project-scoped service account.
# All values come from environment variables; left unset, telemetry endpoints report
# "configured: false" instead of failing.
openstack.telemetry.keystone-url=${OS_KEYSTONE_URL:}
openstack.telemetry.gnocchi-url=${OS_GNOCCHI_URL:}
openstack.telemetry.username=${OS_USERNAME:}
openstack.telemetry.password=${OS_PASSWORD:}
openstack.telemetry.project-name=${OS_PROJECT_NAME:service}
openstack.telemetry.user-domain=${OS_USER_DOMAIN:Default}

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Surface RuntimeException messages (e.g. "Échec de l'attachement du volume...") to callers -
# without this, Spring's default error body omits the message and the frontend only ever sees
# a generic fallback text, regardless of how specific the thrown exception's message is.
server.error.include-message=always
