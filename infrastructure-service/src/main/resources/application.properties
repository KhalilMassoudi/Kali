spring.application.name=infrastructure-service
server.port=8083

# Config Server (optional - fallback to local properties if unavailable)
spring.config.import=optional:configserver:http://localhost:8888

# Database Configuration (fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/infrastructure_db
spring.datasource.username=postgres
spring.datasource.password=antigravity
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# OpenStack Configuration
openstack.auth.endpoint=http://controller:5000/v3
openstack.auth.username=safozi-app
openstack.auth.password=${OPENSTACK_PASSWORD:changeme}
openstack.auth.project=safozi
openstack.auth.domain=default
openstack.auth.region=RegionOne

openstack.nova.endpoint=http://192.168.1.49:8774/v2.1
openstack.glance.endpoint=http://192.168.1.49:9292/v2
openstack.neutron.endpoint=http://192.168.1.49:9696

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
