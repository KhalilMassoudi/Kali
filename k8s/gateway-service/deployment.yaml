apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/khalilmassoudi/gateway-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: SERVICES_AUTH_URL
              value: "http://auth-service:8081"
            - name: SERVICES_CHAT_URL
              value: "http://chat-service:8082"
            - name: SERVICES_INFRASTRUCTURE_URL
              value: "http://infrastructure-service:8083"
            - name: SERVICES_BILLING_URL
              value: "http://billing-service:8084"
            - name: SERVICES_SUPPORT_URL
              value: "http://support-service:8085"
            - name: SERVICES_MONITORING_URL
              value: "http://monitoring-service:8086"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
