apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/khalilmassoudi/frontend:latest
          ports:
            - containerPort: 80
          env:
            # Already the image's own default (see frontend/Dockerfile) - set explicitly
            # here anyway so the manifest is self-documenting.
            - name: GATEWAY_URL
              value: "http://gateway-service:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
