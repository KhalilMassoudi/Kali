apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  labels:
    app: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: ghcr.io/khalilmassoudi/chat-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/chat_db"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: OLLAMA_API_URL
              value: "http://ollama-tunnel:11434"
            - name: SERVICES_INFRASTRUCTURE_URL
              value: "http://infrastructure-service:8083"
            - name: SERVICES_SUPPORT_URL
              value: "http://support-service:8085"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  selector:
    app: chat-service
  ports:
    - port: 8082
      targetPort: 8082
