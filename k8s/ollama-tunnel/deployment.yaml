# Prerequisite (run once on the cluster, never committed — it's the private key):
#   kubectl create secret generic gpu-tunnel-key --from-file=id_ed25519=/root/.ssh/gpu_tunnel
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-tunnel
  labels:
    app: ollama-tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-tunnel
  template:
    metadata:
      labels:
        app: ollama-tunnel
    spec:
      # Pinned to the control-plane node: it's the only node whose outbound
      # SSH path to the GPU box has actually been verified (the worker
      # node's egress got refused — likely a source-IP restriction on the
      # GPU box's side that hasn't been checked against the worker yet).
      nodeSelector:
        kubernetes.io/hostname: node18783-env-3618209.my.p4d.click
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama-tunnel
          image: ghcr.io/khalilmassoudi/ollama-tunnel:latest
          env:
            - name: SSH_HOST
              value: "117.18.102.45"
            - name: SSH_PORT
              value: "31487"
            - name: SSH_USER
              value: "ubuntu"
            - name: LOCAL_PORT
              value: "11434"
            - name: REMOTE_PORT
              value: "11434"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: gpu-tunnel-key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: gpu-tunnel-key
          secret:
            secretName: gpu-tunnel-key
            defaultMode: 0400
            items:
              - key: id_ed25519
                path: gpu_tunnel
