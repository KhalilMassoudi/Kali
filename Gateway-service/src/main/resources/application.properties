spring.application.name=Gateway-service
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT Secret (same as auth-service)
jwt.secret=pPFM3kM5_3idcnhixl8AcKNtfhbmiUurkwXzR4GNJIvIIaXctfq7fyJjS5_nLOvcU6_pXrtHeQiyIJO1LamLMA==

# Disable built-in Gateway route auto-config (using custom RouterFunction instead)
spring.cloud.gateway.mvc.enabled=false

# Never let Spring parse multipart bodies here — the raw-byte proxy must forward them untouched.
spring.servlet.multipart.enabled=false

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
