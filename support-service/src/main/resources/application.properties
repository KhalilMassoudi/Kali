spring.application.name=support-service
server.port=8085

# Config Server (optional - fallback to local properties if unavailable)
spring.config.import=optional:configserver:http://localhost:8888

# Database Configuration (fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/support_db
spring.datasource.username=postgres
spring.datasource.password=antigravity
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (fallback if Config Server is unavailable)
jwt.secret=pPFM3kM5_3idcnhixl8AcKNtfhbmiUurkwXzR4GNJIvIIaXctfq7fyJjS5_nLOvcU6_pXrtHeQiyIJO1LamLMA==
app.frontend-url=http://localhost:4200

# Ticket attachments (stored as DB blobs — see TicketAttachment)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
