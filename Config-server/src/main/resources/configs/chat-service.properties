# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gemini (api.key intentionally omitted - client-side-only secret, see chat-service/.env)
# Interactions API (function calling natif) - voir https://ai.google.dev/api/interactions-api
# Inutilisé tant que ollamaAgentService est actif, conservé pour repasser sur Gemini facilement.
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.8-flash
gemini.max-tokens=1000

# Ollama (modèle local, développement uniquement)
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:hermes3:70b}

# Downstream services
services.infrastructure.url=http://localhost:8083
services.support.url=http://localhost:8085

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
