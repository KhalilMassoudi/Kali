spring.application.name=chat-service
server.port=8082

# Config Server (optional - fallback to local properties if unavailable)
spring.config.import=optional:configserver:http://localhost:8888

# Database Configuration (fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/chat_db
spring.datasource.username=postgres
spring.datasource.password=antigravity
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gemini Configuration
gemini.api.key=AIzaSyBl-amoj8WmKjekNLS2HJrZbOXLSGD2t8w
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-2.0-flash
gemini.max-tokens=1000

# Downstream services
services.infrastructure.url=http://localhost:8083
services.support.url=http://localhost:8085

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
