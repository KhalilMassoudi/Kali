spring.application.name=chat-service
server.port=8082

# Config Server (optional - fallback to local properties if unavailable)
# .env (gitignored, next to this pom.xml) - local secrets loaded as properties, e.g. GEMINI_API_KEY=...
spring.config.import=optional:configserver:http://localhost:8888,optional:file:.env[.properties]

# Database Configuration (fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/chat_db
spring.datasource.username=postgres
spring.datasource.password=antigravity
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (fallback if Config Server is unavailable)
jwt.secret=pPFM3kM5_3idcnhixl8AcKNtfhbmiUurkwXzR4GNJIvIIaXctfq7fyJjS5_nLOvcU6_pXrtHeQiyIJO1LamLMA==

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gemini Configuration - Interactions API (function calling natif) - inutilisé tant que
# ollamaAgentService est actif ci-dessous, conservé pour repasser sur Gemini facilement.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.8-flash
gemini.max-tokens=1000

# Ollama (modèle local, développement uniquement - pas de déploiement tant qu'il n'y a
# pas de serveur GPU dédié). Lancer "ollama serve" puis "ollama pull qwen2.5:3b" en local.
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:hermes3:70b}

# Downstream services
services.infrastructure.url=http://localhost:8083
services.support.url=http://localhost:8085
services.billing.url=http://localhost:8084

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
