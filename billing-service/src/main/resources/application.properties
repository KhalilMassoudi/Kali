spring.application.name=billing-service
server.port=8084

# Config Server (optional - fallback to local properties if unavailable)
spring.config.import=optional:configserver:http://localhost:8888

# Database Configuration (fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/billing_db
spring.datasource.username=postgres
spring.datasource.password=antigravity
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT (same secret as every other service - needed to mint an internal service token
# for the metering job's calls to infrastructure-service's admin endpoints)
jwt.secret=pPFM3kM5_3idcnhixl8AcKNtfhbmiUurkwXzR4GNJIvIIaXctfq7fyJjS5_nLOvcU6_pXrtHeQiyIJO1LamLMA==

services.infrastructure.url=http://localhost:8083

# auth-service: user lookups (client name/email/role) and notification emails - it owns the SMTP config.
services.auth.url=http://localhost:8081

# Metering tick interval, in minutes - how often usage is calculated and deducted.
billing.metering.interval-minutes=10

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
