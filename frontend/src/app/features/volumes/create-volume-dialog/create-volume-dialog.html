<p-dialog
  [(visible)]="visible"
  [modal]="true"
  header="Créer un volume"
  [style]="{ width: '28rem' }"
  [dismissableMask]="true"
  styleClass="create-volume-dialog"
>
  <p class="dialog-subtitle">Provisionnez un volume de stockage bloc (Cinder)</p>

  @if (error()) {
    <p-message severity="error" styleClass="dialog-error">{{ error() }}</p-message>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
    <div class="field">
      <label for="name">Nom du volume</label>
      <input
        id="name"
        pInputText
        formControlName="name"
        placeholder="mon-volume-data"
        fluid
        [invalid]="!!nameError"
      />
      @if (nameError) {
        <p class="field-error">{{ nameError }}</p>
      } @else {
        <p class="field-hint">Lettres minuscules, chiffres et tirets uniquement</p>
      }
    </div>

    <div class="field">
      <label for="sizeGb">Taille (GB)</label>
      <p-inputnumber inputId="sizeGb" formControlName="sizeGb" [min]="1" [showButtons]="true" [fluid]="true" />
    </div>

    <div class="dialog-footer">
      <p-button label="Annuler" severity="secondary" [outlined]="true" type="button" styleClass="footer-btn" (onClick)="close()" />
      <p-button
        [label]="loading() ? 'Création...' : 'Créer le volume'"
        type="submit"
        [loading]="loading()"
        styleClass="footer-btn"
      />
    </div>
  </form>
</p-dialog>
