<p-dialog
  [(visible)]="visible"
  [modal]="true"
  header="Créer un groupe de sécurité"
  [style]="{ width: '28rem' }"
  [dismissableMask]="true"
>
  <p class="dialog-subtitle">Un groupe vide au départ — ajoutez des règles ensuite (ports 80, 443, etc.)</p>

  @if (error()) {
    <p-message severity="error" styleClass="dialog-error">{{ error() }}</p-message>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
    <div class="field">
      <label for="name">Nom du groupe</label>
      <input id="name" pInputText formControlName="name" placeholder="web-public" fluid [invalid]="!!nameError" />
      @if (nameError) {
        <p class="field-error">{{ nameError }}</p>
      } @else {
        <p class="field-hint">Lettres minuscules, chiffres et tirets uniquement</p>
      }
    </div>

    <div class="field">
      <label for="description">Description <span class="field-optional">(optionnel)</span></label>
      <input id="description" pInputText formControlName="description" placeholder="Autorise HTTP/HTTPS" fluid />
    </div>

    <div class="dialog-footer">
      <p-button label="Annuler" severity="secondary" [outlined]="true" type="button" styleClass="footer-btn" (onClick)="close()" />
      <p-button
        [label]="loading() ? 'Création...' : 'Créer le groupe'"
        type="submit"
        [loading]="loading()"
        styleClass="footer-btn"
      />
    </div>
  </form>
</p-dialog>
