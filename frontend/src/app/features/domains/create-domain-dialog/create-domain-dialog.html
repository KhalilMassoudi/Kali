<p-dialog
  [(visible)]="visible"
  [modal]="true"
  header="Ajouter un domaine"
  [style]="{ width: '28rem' }"
  [dismissableMask]="true"
  styleClass="create-domain-dialog"
>
  <p class="dialog-subtitle">Enregistrez un nom de domaine pour votre compte</p>

  @if (error()) {
    <p-message severity="error" styleClass="dialog-error">{{ error() }}</p-message>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
    <div class="field">
      <label for="name">Nom de domaine</label>
      <input
        id="name"
        pInputText
        formControlName="name"
        placeholder="monsite.com"
        fluid
        [invalid]="!!nameError"
      />
      @if (nameError) {
        <p class="field-error">{{ nameError }}</p>
      } @else {
        <p class="field-hint">Ex: monsite.com — sans http:// ni www.</p>
      }
    </div>

    <div class="dialog-footer">
      <p-button label="Annuler" severity="secondary" [outlined]="true" type="button" styleClass="footer-btn" (onClick)="close()" />
      <p-button
        [label]="loading() ? 'Création...' : 'Ajouter le domaine'"
        type="submit"
        [loading]="loading()"
        styleClass="footer-btn"
      />
    </div>
  </form>
</p-dialog>
